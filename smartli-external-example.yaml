substitutions:
  name: smartli-bms
  tx_pin: GPIO17
  rx_pin: GPIO16
  flow_control_pin: GPIO4

esphome:
  name: ${name}
  comment: "Read SmartLi BMS binary telemetry via RS485"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [smartli_bms]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: smartli_uart
  baud_rate: 9600
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  rx_buffer_size: 512

smartli_bms:
  id: smartli_hub
  uart_id: smartli_uart
  packs:
    - address: 1
      modbus_address: 217
    - address: 2
      modbus_address: 214
    - address: 3
      modbus_address: 215
    - address: 4
      modbus_address: 216
    - address: 5
      modbus_address: 218
  flow_control_pin: ${flow_control_pin}
  update_interval: 30s
  dcdc_update_interval: 60s
  response_timeout: 700ms

  - platform: smartli_bms
    smartli_bms_id: smartli_hub
    address: 1
    full_capacity: {name: "SmartLi 1 Full Capacity"}
    remaining_capacity: {name: "SmartLi 1 Remaining Capacity"}
    bus_voltage: {name: "SmartLi 1 Bus Voltage"}
    state_of_health: {name: "SmartLi 1 State of Health"}
