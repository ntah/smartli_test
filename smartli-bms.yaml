select:
  - platform: template
    name: "Mode BMS"
    id: bms_mode_selector
    optimistic: true
    initial_option: " "
    options:
      - " "
      - "Constant"
      - "Battery"
      
    on_value:
      then:
        - lambda: |-
            if (!id(bms_select_ready)) return;
            if (id(bms_mode_selector).current_option() == "Constant") {
              id(smartli_bms_1_mode_writer).make_call().set_value(0x0101).perform();
              id(smartli_bms_2_mode_writer).make_call().set_value(0x0101).perform();
              id(smartli_bms_3_mode_writer).make_call().set_value(0x0101).perform();
              id(smartli_bms_4_mode_writer).make_call().set_value(0x0101).perform();
              id(smartli_bms_5_mode_writer).make_call().set_value(0x0101).perform();              
            } else if (id(bms_mode_selector).current_option() == "Battery") {
              id(smartli_bms_1_mode_writer).make_call().set_value(0x0303).perform();
              id(smartli_bms_2_mode_writer).make_call().set_value(0x0303).perform();
              id(smartli_bms_3_mode_writer).make_call().set_value(0x0303).perform();
              id(smartli_bms_4_mode_writer).make_call().set_value(0x0303).perform();
              id(smartli_bms_5_mode_writer).make_call().set_value(0x0303).perform();
            }

