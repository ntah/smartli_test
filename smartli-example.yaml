substitutions:
  name: smartli-bms
  external_components_source: github://ntah/esphome-smartli-bms@main
  tx_pin: GPIO17                  # ESP32 UART TX connected to the RS485 transceiver DI pin
  rx_pin: GPIO16                  # ESP32 UART RX connected to the RS485 transceiver RO pin
  flow_control_pin: GPIO4         # RS485 DE/RE direction-control pin

esphome:
  name: ${name}
  comment: "Read bank battery-bank telemetry and DCDC data through RS485"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s                   # Always check the configured source for component updates

wifi:
  ssid: !secret wifi_ssid         # Wi-Fi network name stored in secrets.yaml
  password: !secret wifi_password # Wi-Fi password stored in secrets.yaml

time:
  - platform: sntp
    id: esptime
    timezone: Asia/Jakarta         # Used by last_update to publish HH:MM:SS

logger:
  level: NONE                     # Change to DEBUG while troubleshooting
  baud_rate: 0                    # Keep the hardware UART free from serial logger output

api:
  encryption:
    key: "xxx"                   # Replace with the API encryption key generated by ESPHome

ota:
  - platform: esphome
    password: "xxxx"             # Replace with your OTA update password

uart:
  id: smartli_uart
  baud_rate: 9600                 # bank RS485 communication speed
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  rx_buffer_size: 512             # Large enough for a complete bank telemetry frame

smartli_bms:
  id: smartli_hub
  uart_id: smartli_uart
  flow_control_pin: ${flow_control_pin} # Omit this only when the RS485 transceiver handles direction automatically
  update_interval: never                # Disable scheduled cycles because continuous polling is enabled below
  continuous_polling: true              # Start a new cycle after every configured pack has been processed
  dcdc_update_interval: 60s             # Minimum interval for refreshing DCDC settings and operating data
  response_timeout: 2000ms              # Maximum time to wait for a response from a battery
  pack_delay: 2s                        # Delay after one pack finishes before the next pack starts
  request_delay: 1s                     # Delay between telemetry, DCDC, and other requests for the same pack

  packs:
    - id: battery_bank1
      address: 1                  # bank protocol address; this is not the discovered Modbus slave address

      sensors:
        full_capacity: {name: "bank 1 cap"}
        remaining_capacity: {name: "bank 1 Remaining Capacity"}
        bus_voltage: {name: "bank 1 V Bus"}
        state_of_health: {name: "bank 1 SOH"}
        total_charged_ah: {name: "bank 1 Total Charged Ah"}
        total_discharged_ah: {name: "bank 1 Total Discharged Ah"}
        total_charged_energy: {name: "bank 1 tCharge"}
        total_discharged_energy: {name: "bank 1 tdisCharge"}
        dcdc_discharge_bus_voltage_set: {name: "bank 1 Vbus set"}
        dcdc_discharge_bus_current_set: {name: "bank 1 Ibus set"}
        dcdc_discharge_bus_power_set: {name: "bank 1 Pbus set"}
        dcdc_charging_battery_voltage_set: {name: "bank 1 Charging Voltage Set"}
        dcdc_charge_current_set: {name: "bank 1 Ibat set"}
        dcdc_charging_battery_power_set: {name: "bank 1 Charging Power Set"}
        dcdc_bus_voltage_ladder: {name: "bank 1 Vbus DoD"}
        dcdc_depth_dod: {name: "bank 1 DoD"}
        dcdc_vbus_set_max_autoself: {name: "bank 1 VBUS Set Max Autoself"}
        cell_min_voltage: {name: "bank 1 V min"}
        cell_max_voltage: {name: "bank 1 V max"}
        cell_delta_voltage: {name: "bank 1 V diff"}
        cell_average_voltage: {name: "bank 1 V ave"}
        power: {name: "bank 1 power"}
        battery_max_temperature: {name: "bank 1 Max Temp"}
        mos_max_temperature: {name: "bank 1 MOS Temp"}
        cycle_count: {name: "bank 1 Cycle"}
        battery_temperature_1: {name: "bank 1 Temp 1"}
        battery_temperature_2: {name: "bank 1 Temp 2"}
        battery_temperature_3: {name: "bank 1 Temp 3"}
        battery_temperature_4: {name: "bank 1 Temp 4"}
        environment_temperature: {name: "bank 1 Environment Temp"}
        mos_temperature_1: {name: "bank 1 MOS Temp 1"}
        mos_temperature_2: {name: "bank 1 MOS Temp 2"}
        balance_temperature: {name: "bank 1 Balance Temp"}
        cell_voltage_1: {name: "bank 1 V Cell01"}
        cell_voltage_2: {name: "bank 1 V Cell02"}
        cell_voltage_3: {name: "bank 1 V Cell03"}
        cell_voltage_4: {name: "bank 1 V Cell04"}
        cell_voltage_5: {name: "bank 1 V Cell05"}
        cell_voltage_6: {name: "bank 1 V Cell06"}
        cell_voltage_7: {name: "bank 1 V Cell07"}
        cell_voltage_8: {name: "bank 1 V Cell08"}
        cell_voltage_9: {name: "bank 1 V Cell09"}
        cell_voltage_10: {name: "bank 1 V Cell10"}
        cell_voltage_11: {name: "bank 1 V Cell11"}
        cell_voltage_12: {name: "bank 1 V Cell12"}
        cell_voltage_13: {name: "bank 1 V Cell13"}
        cell_voltage_14: {name: "bank 1 V Cell14"}
        cell_voltage_15: {name: "bank 1 V Cell15"}
        pack_voltage:
          name: "bank 1 V bat"
        current:
          name: "bank 1 Current"
        state_of_charge:
          name: "bank 1 SOC"

      selects:
        avg_charge_percent: {name: "bank 1 Avg Charge % Set"}
        charging_loop: {name: "bank 1 Charging Loop Set"}
        discharge_loop: {name: "bank 1 Discharge Loop Set"}
        dod_percent: {name: "bank 1 DOD % Set"}
        ibus_percent: {name: "bank 1 IBUS % Set"}
        pbus_percent: {name: "bank 1 PBUS Discharge % Set"}
        vbus_discharge_set: {name: "bank 1 VBUS Discharge Set"}
        vbus_dod: {name: "bank 1 VBUS DOD Set"}
        # Global mode control. It writes register 0x1016 on every configured
        # pack that has a discovered or manually configured Modbus address.
        # Define this entity only once; it may be placed under any pack.
        mode: {name: "Mode BMS"}

      text_sensors:
        pcb_barcode:
          name: "bank 1 PCB Barcode"
        pack_barcode:
          name: "bank 1 Pack Barcode"
        modbus_address:
          name: "bank 1 Modbus Address"
        status:
          name: "bank 1 Status"
        mode:
          name: "bank 1 Mode"
        operating_state:
          name: "bank 1 Operating State"
        last_update:
          name: "bank 1 Last Update"

    - id: battery_bank2
      address: 2                  # Add or remove pack blocks to match the actual bank

      sensors:
        full_capacity: {name: "bank 2 cap"}
        remaining_capacity: {name: "bank 2 Remaining Capacity"}
        bus_voltage: {name: "bank 2 V Bus"}
        state_of_health: {name: "bank 2 SOH"}
        total_charged_ah: {name: "bank 2 Total Charged Ah"}
        total_discharged_ah: {name: "bank 2 Total Discharged Ah"}
        total_charged_energy: {name: "bank 2 tCharge"}
        total_discharged_energy: {name: "bank 2 tdisCharge"}
        dcdc_discharge_bus_voltage_set: {name: "bank 2 Vbus_set"}
        dcdc_discharge_bus_current_set: {name: "bank 2 Ibus set"}
        dcdc_discharge_bus_power_set: {name: "bank 2 Pbus set"}
        dcdc_charging_battery_voltage_set: {name: "bank 2 Charging Voltage Set"}
        dcdc_charge_current_set: {name: "bank 2 Ibat_set"}
        dcdc_charging_battery_power_set: {name: "bank 2 Charging Power Set"}
        dcdc_bus_voltage_ladder: {name: "bank 2 Vbus DoD"}
        dcdc_depth_dod: {name: "bank 2 DoD"}
        dcdc_vbus_set_max_autoself: {name: "bank 2 VBUS Set Max Autoself"}
        cell_min_voltage: {name: "bank 2 V min"}
        cell_max_voltage: {name: "bank 2 V max"}
        cell_delta_voltage: {name: "bank 2 V diff"}
        cell_average_voltage: {name: "bank 2 V ave"}
        power: {name: "bank 2 power"}
        battery_max_temperature: {name: "bank 2 Max Temp"}
        mos_max_temperature: {name: "bank 2 MOS Temp"}
        cycle_count: {name: "bank 2 Cycle"}
        battery_temperature_1: {name: "bank 2 Temp 1"}
        battery_temperature_2: {name: "bank 2 Temp 2"}
        battery_temperature_3: {name: "bank 2 Temp 3"}
        battery_temperature_4: {name: "bank 2 Temp 4"}
        environment_temperature: {name: "bank 2 Environment Temp"}
        mos_temperature_1: {name: "bank 2 MOS Temp 1"}
        mos_temperature_2: {name: "bank 2 MOS Temp 2"}
        balance_temperature: {name: "bank 2 Balance Temp"}
        cell_voltage_1: {name: "bank 2 V Cell01"}
        cell_voltage_2: {name: "bank 2 V Cell02"}
        cell_voltage_3: {name: "bank 2 V Cell03"}
        cell_voltage_4: {name: "bank 2 V Cell04"}
        cell_voltage_5: {name: "bank 2 V Cell05"}
        cell_voltage_6: {name: "bank 2 V Cell06"}
        cell_voltage_7: {name: "bank 2 V Cell07"}
        cell_voltage_8: {name: "bank 2 V Cell08"}
        cell_voltage_9: {name: "bank 2 V Cell09"}
        cell_voltage_10: {name: "bank 2 V Cell10"}
        cell_voltage_11: {name: "bank 2 V Cell11"}
        cell_voltage_12: {name: "bank 2 V Cell12"}
        cell_voltage_13: {name: "bank 2 V Cell13"}
        cell_voltage_14: {name: "bank 2 V Cell14"}
        cell_voltage_15: {name: "bank 2 V Cell15"}
        pack_voltage:
          name: "bank 2 V bat"
        current:
          name: "bank 2 Current"
        state_of_charge:
          name: "bank 2 SOC"

      selects:
        avg_charge_percent: {name: "bank 2 Avg Charge % Set"}
        charging_loop: {name: "bank 2 Charging Loop Set"}
        discharge_loop: {name: "bank 2 Discharge Loop Set"}
        dod_percent: {name: "bank 2 DOD % Set"}
        ibus_percent: {name: "bank 2 IBUS % Set"}
        pbus_percent: {name: "bank 2 PBUS Discharge % Set"}
        vbus_discharge_set: {name: "bank 2 VBUS Discharge Set"}
        vbus_dod: {name: "bank 2 VBUS DOD Set"}

      text_sensors:
        pcb_barcode:
          name: "bank 2 PCB Barcode"
        pack_barcode:
          name: "bank 2 Pack Barcode"
        modbus_address:
          name: "bank 2 Modbus Address"
        status:
          name: "bank 2 Status"
        mode:
          name: "bank 2 Mode"
        operating_state:
          name: "bank 2 Operating State"
        last_update:
          name: "bank 2 Last Update"

sensor:
  - platform: uptime
    name: "${name} Uptime"
    update_interval: 30s

  - platform: wifi_signal
    name: "${name} Wifi Signal"
    update_interval: 30s

button:
  - platform: restart
    id: restart_esp
    name: "${name} Reboot"
