  framework:
    type: esp-idf  

api:
  encryption:
    key: "WiG09hHEV4BoldmQNH/DgIJQjobCYqEjhlUeYsXs3WY="

ota:
  - platform: esphome
    password: "3855b823beac6a0ad0890db2347e2b29"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  baud_rate: 0
  level: VERY_VERBOSE

debug:
  update_interval: 60s

uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    #rx_timeout: 50
    rx_buffer_size: 513  
    # The increased RX buffer size is important because
    # the full BMS response must fit into the buffer
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        delimiter: "\r"
      sequence:
        - lambda: UARTDebug::log_string(direction, bytes);

modbus:
  - id: modbus0
    uart_id: uart_0
    flow_control_pin: GPIO4
    send_wait_time: 500ms

modbus_controller:
  - id: bms1
    address: 217
    modbus_id: modbus0
    update_interval: never
    command_throttle: 80ms

  - id: bms2
    address: 214
    modbus_id: modbus0
    update_interval: never
    command_throttle: 80ms    

  - id: bms3
    address: 215
    modbus_id: modbus0
    update_interval: never
    command_throttle: 80ms    

  - id: bms4
    address: 216
    modbus_id: modbus0
    update_interval: never
    command_throttle: 80ms   

  - id: bms5
    address: 218
    modbus_id: modbus0
    update_interval: never
    command_throttle: 80ms  

sensor:   
  - platform: debug
    free:
      name: "pzem Heap Free"
    block:
      name: "pzem Heap Max Block"
    loop_time:
      name: "pzem Loop Time"
