    id: smartli_bms_2_code
    address: 4157
    register_type: holding
    value_type: U_WORD
    internal: true
    entity_category: diagnostic 
    on_value:
      then:
        - component.update: smartli_bms_2_status
        - lambda: |-
            uint16_t val = (uint16_t) x;
            uint8_t discharge_mode = val >> 8;
            if (discharge_mode == 1) {
              id(smartli_bms_2_mode).publish_state("Constant");
            } else if (discharge_mode == 2) {
              id(smartli_bms_2_mode).publish_state("Battery");
            } else {
              id(smartli_bms_2_mode).publish_state(" ");
            }             

