substitutions:
  name: smartli-bms
  device_description: "Monitor and control multiple smartli V3 BMS via RS485 (Modbus)"
  tx_pin: GPIO17 #GPIO17
  rx_pin: GPIO16 #GPIO16
  modbus_update_interval_pagi: 30s
  modbus_update_interval_malam: 60s
  delay_interval_pagi: 3000 #ms
  delay_interval_malam: 10000 #ms
  batas_pagi: 6
  batas_malam: 23

esphome:
  name: ${name}
  comment: ${device_description}

  on_boot:
    priority: -10
    then:
      - delay: 30s
      - lambda: |-
          id(bms_select_ready) = true;
      - script.execute: poll_all_bms

globals:
  - id: bms_select_ready
    type: bool
    restore_value: no
    initial_value: 'false'  
  - id: modbus_enabled
    type: bool
    restore_value: no
    initial_value: "true"
  - id: bms_select_synced_once
    type: bool
    restore_value: no
    initial_value: 'false'    
  - id: poll_start
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: delay_interval
    type: uint32_t
    restore_value: no
    initial_value: '1000'    
  - id: current_bms
    type: uint8_t
    restore_value: no
    initial_value: '1'

script:
  - id: update_delay_interval
    mode: restart
    then:
      - lambda: |-
          auto now = id(esptime).now();
          if (!now.is_valid())
            return;
          if (now.hour >= ${batas_pagi} &&
              now.hour < ${batas_malam}) {
            id(delay_interval) = ${delay_interval_pagi};
          } else {
            id(delay_interval) = ${delay_interval_malam};
          }

  - id: poll_next_bms
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(modbus_enabled);'
          then:
            - script.execute: update_delay_interval
            - lambda: |-
                ESP_LOGI( "POLL", "Delay interval = %lu ms", (unsigned long) id(delay_interval));
            - delay: !lambda "return id(delay_interval);"
            - lambda: |-
                id(current_bms)++;
                if (id(current_bms) > 5)
                  id(current_bms) = 1;
                ESP_LOGI( "POLL", "Start BMS%d", id(current_bms)
                );
                id(poll_start) = millis();
                switch (id(current_bms)) {
                  case 1:
                    id(bms1).update();
                    break;
                  case 2:
                    id(bms2).update();
                    break;
                  case 3:
                    id(bms3).update();
                    break;
                  case 4:
                    id(bms4).update();
                    break;
                  case 5:
                    id(bms5).update();
                    break;
                }

  - id: poll_all_bms
    mode: single
    then:
      - lambda: |-
          id(current_bms)=1;
          ESP_LOGI("POLL","Start BMS1");
          id(poll_start)=millis();
          id(bms1).update();

esp32:
