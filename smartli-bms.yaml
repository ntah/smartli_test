    id: bms4_last_data_time
    icon: mdi:clock

  - platform: template
    name: "BMS5 Last update"
    id: bms5_last_data_time
    icon: mdi:clock

  - platform: template
    name: "smartLi bms 1 Mode"
    id: smartli_bms_1_mode
    entity_category: diagnostic
    update_interval: never

  - platform: template
    name: "smartLi bms 1 Status"
    id: smartli_bms_1_status
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      uint16_t status_value = (uint16_t) id(smartli_bms_1_code).state;
      uint8_t running_status = status_value & 0xFF;
      switch (running_status) {
        case 1: return {"Precharge"};
        case 2: return {"Charge"};
        case 3: return {"Discharge"};
        case 4: return {"BUCK Charge"};
        case 5: return {"BOOST Charge"};
        case 6: return {"BUCK Discharge"};
        case 7: return {"BOOST Discharge"};
        case 8: return {"Standby"};
        case 9: return {"Alarm"};
        case 10: return {"Protection shutdown"};
        case 11: return {"Fault shutdown"};
        case 12: return {"Maintenance mode"};
        case 13: return {"Test mode"};
        case 14: return {"Sleep mode"};
        default: return {"Unknown"};
      }    
    on_value:
      then:
        - lambda: |-
            // 🔒 sudah pernah sync? stop.
            if (id(bms_select_synced_once)) return;

            // pastikan mode sudah kebaca dulu
            std::string mode = id(smartli_bms_1_mode).state;

            if (mode == "Constant" || mode == "Battery") {
              id(bms_mode_selector).publish_state(mode);

              id(bms_select_synced_once) = true;
              id(bms_select_ready) = true;

              ESP_LOGI("BMS", "Initial mode synced ONCE from BMS: %s", mode.c_str());
            }      

