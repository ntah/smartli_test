substitutions:
  name: smartli-bms
  tx_pin: GPIO17
  rx_pin: GPIO16
  flow_control_pin: GPIO4
  delay_interval_pagi: "3000"
  delay_interval_malam: "10000"
  batas_pagi: "6"
  batas_malam: "23"

globals:
  - id: delay_interval
    type: uint32_t
    restore_value: false
    initial_value: "3000"

script:
  - id: update_delay_interval
    mode: restart
    then:
      - lambda: |-
          auto now = id(esptime).now();

          if (!now.is_valid()) {
            ESP_LOGW("smartli_schedule",
                     "Waktu belum valid, pack delay tidak diubah");
            return;
          }

          if (now.hour >= ${batas_pagi} &&
              now.hour < ${batas_malam}) {
            id(delay_interval) = ${delay_interval_pagi};
          } else {
            id(delay_interval) = ${delay_interval_malam};
          }

          id(smartli_hub).set_pack_delay(id(delay_interval));

          ESP_LOGI("smartli_schedule",
                   "Pack delay diubah menjadi %lu ms",
                   static_cast<unsigned long>(id(delay_interval)));
                   
time:
  - platform: sntp
    id: esptime
    timezone: Asia/Jakarta

    on_time_sync:
      then:
        - script.execute: update_delay_interval

    on_time:
      - seconds: 0
        minutes: 0
        hours: "*"
        then:
          - script.execute: update_delay_interval
          
esphome:
  name: ${name}
  comment: "Read SmartLi BMS binary telemetry via RS485"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [smartli_bms]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: smartli_uart
  baud_rate: 9600
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  rx_buffer_size: 512

smartli_bms:
  id: smartli_hub
  uart_id: smartli_uart
  packs:
    - address: 1
    - address: 2
    - address: 3
    - address: 4
    - address: 5
  flow_control_pin: ${flow_control_pin}
  update_interval: 30s
  dcdc_update_interval: 60s
  response_timeout: 700ms
  pack_delay: 2s
  request_delay: 1s

